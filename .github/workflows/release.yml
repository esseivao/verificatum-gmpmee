name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GMP (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev

      - name: Install GMP (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install gmp

      - name: Install GMP (Windows)
        if: startsWith(matrix.os, 'windows')
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 2b65c20fc66eda893aa15a15a453c3cf09500b19
          vcpkgJsonGlob: vcpkg.json

      - name: Configure Release (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=ON `
            -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Configure Release (Unix)
        if: "!startsWith(matrix.os, 'windows')"
        shell: bash
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON

      - name: Build Release
        run: cmake --build build --config Release

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: gmpmee-binaries-${{ matrix.os }}
          path: |
            build/Release/*.dll
            build/Release/*.lib
            build/*.so*
            build/*.dylib
            build/*.a
            gmpmee.h
          if-no-files-found: warn

  publish:
    name: Publish Pre-release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: GMPMEE ${{ github.ref_name }} (Beta)
          body: |
            ## Pre-release ${{ github.ref_name }}

            First beta of the modernized GMPMEE library.

            ### Changes
            - Modern CMake build system
            - Multi-platform CI (Linux, macOS, Windows)
            - Code quality tools integrated
            - Windows MSVC + MinGW support

            **This is a beta release for testing.**
          draft: false
          prerelease: true
          files: |
            artifacts/**/*
          token: ${{ secrets.GITHUB_TOKEN }}
