name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master, fix/interop-win-linux ]

permissions:
  contents: read

jobs:
  # ====================== Linux + macOS ======================
  unix:
    name: ${{ matrix.os }} - ${{ matrix.compiler }} - ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        compiler: [ gcc, clang ]
        build_type: [ Debug, Release ]
        include:
          # Dedicated Clang sanitizer job (only on Linux).
          - os: ubuntu-latest
            compiler: clang
            build_type: Debug
            sanitizer: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool m4 python3 libgmp-dev
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y clang
          fi

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install autoconf automake libtool gmp
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            brew install gcc
          fi
          mkdir -p "$RUNNER_TEMP/gnubin"
          ln -sf "$(brew --prefix libtool)/bin/glibtoolize" "$RUNNER_TEMP/gnubin/libtoolize"
          echo "$RUNNER_TEMP/gnubin" >> "$GITHUB_PATH"
          echo "CPPFLAGS=-I$(brew --prefix gmp)/include" >> "$GITHUB_ENV"
          echo "GMP_LDFLAGS=-L$(brew --prefix gmp)/lib" >> "$GITHUB_ENV"

      - name: Select compiler and flags
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ] && [ "${{ matrix.compiler }}" = "gcc" ]; then
            cc_path="$(ls "$(brew --prefix)"/bin/gcc-[0-9]* | sort | tail -n 1)"
            echo "CC=$cc_path" >> "$GITHUB_ENV"
          else
            echo "CC=${{ matrix.compiler }}" >> "$GITHUB_ENV"
          fi

          if [ "${{ matrix.build_type }}" = "Debug" ]; then
            cflags="-O0 -g"
          else
            cflags="-O3"
          fi

          ldflags="${GMP_LDFLAGS:-}"
          if [ "${{ matrix.sanitizer }}" = "true" ]; then
            cflags="$cflags -fsanitize=address,undefined -fno-omit-frame-pointer"
            ldflags="$ldflags -fsanitize=address,undefined"
          fi

          echo "CFLAGS=$cflags" >> "$GITHUB_ENV"
          echo "LDFLAGS=$ldflags" >> "$GITHUB_ENV"

      - name: Bootstrap
        run: make -f Makefile.build

      - name: Configure
        run: ./configure CC="$CC" CFLAGS="$CFLAGS" LDFLAGS="${LDFLAGS:-}"

      - name: Build
        run: make

      - name: Test
        run: make check

  # ====================== Windows - MSVC ======================
  windows-msvc:
    name: Windows - MSVC
    runs-on: windows-latest
    env:
      VCPKG_ROOT: C:\vcpkg

    steps:
      - uses: actions/checkout@v4

      - name: Install GMP
        run: '& "$env:VCPKG_ROOT\vcpkg.exe" install gmp:x64-windows'

      - name: Configure MSVC environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) {
            throw "Visual Studio with MSVC tools was not found."
          }
          "VS_DEV_CMD=$vs\Common7\Tools\VsDevCmd.bat" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build DLL and smoke test
        shell: cmd
        run: |
          call "%VS_DEV_CMD%" -arch=x64
          set "VCPKG_INSTALLED=%VCPKG_ROOT%\installed\x64-windows"
          python gen_trialdiv.py 32 > trialdiv_32.c
          python gen_trialdiv.py 64 > trialdiv_64.c
          python gen_trialdiv.py -safe 32 > trialdiv_safe_32.c
          python gen_trialdiv.py -safe 64 > trialdiv_safe_64.c
          > gmpmee.def echo LIBRARY gmpmee
          >> gmpmee.def echo EXPORTS
          >> gmpmee.def echo gmpmee_spowm_init
          >> gmpmee.def echo gmpmee_spowm_clear
          >> gmpmee.def echo gmpmee_spowm_precomp
          >> gmpmee.def echo gmpmee_spowm_table
          >> gmpmee.def echo gmpmee_spowm_block_batch
          >> gmpmee.def echo gmpmee_spowm
          >> gmpmee.def echo gmpmee_spowm_naive
          >> gmpmee.def echo gmpmee_fpowm_init
          >> gmpmee.def echo gmpmee_fpowm_clear
          >> gmpmee.def echo gmpmee_fpowm_precomp
          >> gmpmee.def echo gmpmee_fpowm_init_precomp
          >> gmpmee.def echo gmpmee_fpowm
          >> gmpmee.def echo gmpmee_millerrabin_init
          >> gmpmee.def echo gmpmee_millerrabin_next_cand
          >> gmpmee.def echo gmpmee_millerrabin_clear
          >> gmpmee.def echo gmpmee_millerrabin_trial
          >> gmpmee.def echo gmpmee_millerrabin_once
          >> gmpmee.def echo gmpmee_millerrabin_reps_rs
          >> gmpmee.def echo gmpmee_millerrabin_rs
          >> gmpmee.def echo gmpmee_millerrabin_next_rs
          >> gmpmee.def echo gmpmee_millerrabin_safe_init
          >> gmpmee.def echo gmpmee_millerrabin_safe_next_cand
          >> gmpmee.def echo gmpmee_millerrabin_safe_clear
          >> gmpmee.def echo gmpmee_millerrabin_safe_trial
          >> gmpmee.def echo gmpmee_millerrabin_safe_once
          >> gmpmee.def echo gmpmee_millerrabin_safe_reps_rs
          >> gmpmee.def echo gmpmee_millerrabin_safe_rs
          >> gmpmee.def echo gmpmee_millerrabin_safe_next_rs
          >> gmpmee.def echo mpz_probab_prime_p_next
          >> gmpmee.def echo mpz_probab_safe_prime_p
          >> gmpmee.def echo mpz_probab_safe_prime_p_next
          >> gmpmee.def echo gmpmee_array_alloc
          >> gmpmee.def echo gmpmee_array_alloc_init
          >> gmpmee.def echo gmpmee_array_clear_dealloc
          >> gmpmee.def echo gmpmee_array_urandomb
          cl /nologo /LD /O2 /I"%VCPKG_INSTALLED%\include" /Fegmpmee.dll spowm.c spowm_clear.c spowm_precomp.c spowm_init.c spowm_table.c spowm_block_batch.c spowm_naive.c array_alloc.c array_clear_dealloc.c array_urandomb.c array_alloc_init.c fpowm.c fpowm_clear.c fpowm_init.c fpowm_precomp.c fpowm_init_precomp.c millerrabin_init.c millerrabin_next_cand.c millerrabin_clear.c millerrabin_trial.c millerrabin_once.c millerrabin_reps_rs.c millerrabin_rs.c millerrabin_next_rs.c millerrabin_safe_init.c millerrabin_safe_next_cand.c millerrabin_safe_clear.c millerrabin_safe_trial.c millerrabin_safe_reps_rs.c millerrabin_safe_rs.c millerrabin_safe_next_rs.c probab_prime_p_next.c probab_safe_prime_p.c probab_safe_prime_p_next.c /link /DEF:gmpmee.def /LIBPATH:"%VCPKG_INSTALLED%\lib" gmp.lib
          cl /nologo /O2 /I"%VCPKG_INSTALLED%\include" /Fegmpmee-msvc.exe gmpmee.c gmpmee.lib /link /LIBPATH:"%VCPKG_INSTALLED%\lib" gmp.lib
          set "PATH=%VCPKG_INSTALLED%\bin;%PATH%"
          gmpmee-msvc.exe 100

  # ====================== Windows - MinGW-w64 GCC ======================
  windows-mingw:
    name: Windows - MinGW-w64 GCC
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            autoconf
            automake
            libtool
            m4
            make
            python
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gmp

      - name: Bootstrap
        run: make -f Makefile.build

      - name: Configure
        run: ./configure CC=gcc

      - name: Build
        run: make

      - name: Test
        run: make check

  # ====================== Ubuntu 32-bit legacy ======================
  build-32bit-legacy:
    name: ubuntu-22.04 32-bit - ${{ matrix.compiler }} - Release
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [ gcc, clang ]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib libc6-dev-i386 autoconf automake libtool m4 python3 libgmp-dev:i386
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y clang
          fi

      - name: Bootstrap
        run: make -f Makefile.build

      - name: Configure
        run: ./configure CC="${{ matrix.compiler }}" CFLAGS="-m32 -O3" CPPFLAGS="-I/usr/include/i386-linux-gnu" LDFLAGS="-m32 -L/usr/lib/i386-linux-gnu"

      - name: Build
        run: make

      - name: Test
        run: make check

  # ====================== FreeBSD ======================
  freebsd:
    name: FreeBSD 15.0
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: vmactions/freebsd-vm@v1
        with:
          release: "15.0"
          usesh: true
          prepare: |
            pkg install -y autoconf automake libtool gmp python gmake m4
          run: |
            gmake -f Makefile.build
            ./configure CC=cc CPPFLAGS="-I/usr/local/include" LDFLAGS="-L/usr/local/lib"
            gmake
            gmake check
